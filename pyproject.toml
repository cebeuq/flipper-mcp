[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flipper-mcp"
version = "0.1.0"
description = "MCP server + Python toolkit to control a Flipper Zero over USB (serial CLI + protobuf RPC)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "pyusb>=1.2",
    "libusb-package>=1.0",
    "mcp>=1.27,<2",
    "protobuf>=5",
    "pillow>=10",
]

[project.optional-dependencies]
proto = ["grpcio-tools>=1.60"]

[project.scripts]
flipper-mcp = "flipper_mcp.server:main"

[tool.setuptools.packages.find]
include = ["flipper_mcp*"]

[tool.setuptools.package-data]
"flipper_mcp.rpc.proto" = ["*.py"]
